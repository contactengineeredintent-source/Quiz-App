<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- First Page Layout Start -->
    <div id="quiz-container" class="">
      <div
        id="logo_section"
        class="ps-5 pt-5 d-flex align-item-center justify-content-left gap-2"
      >
        <div id="logo_image"></div>
        <div id="logo_text" class="fs-1 fw-bold">
          <span class="text-dark">LOGO</span>
        </div>
      </div>
      <div id="tagline" class="ps-5 pt-1 w-50">
        <div class="tag_text fw-bold">
          Quizopia Your Gateway to Trivia Nirvana!
        </div>
      </div>
      <div id="random_btn" class="ps-5 pt-4">
        <button class="randomBtn btn btn-light text-dark rounded rounded-pill fw-bold">
          RANDOM QUIZ
        </button>
      </div>
      <div id="mutltiselect" class="ps-5 pt-3">
        <span class="fs-5 fw-bold bg-dark text-white p-2 rounded"
          >PLAY, LEARN AND ENJOY!</span
        >
        <div
          id="crousel_iamge_container"
          class="d-flex justify-content-between p-2 mt-4 gap-2 border-3 rounded bg-dark"
        >
          <div
            class="order-4 d-flex flex-column align-items-center justify-content-center bg-dark border border-dark rounded border-4 gap-2"
          >
            <img
              class="crousel_image border border-dark border-4 rounded"
              src="indian history.jpg"
              alt="history_image"
            />
            <button
              class="btn selectorBtn fw-bold p-1 section"
              data-section="3"
            >
              INDIAN HISTORY
            </button>
          </div>
          <div
            class="order-1 d-flex flex-column align-items-center justify-content-center bg-dark border border-dark rounded border-4 gap-2"
          >
            <img
              class="crousel_image border border-dark border-4 rounded"
              src="general knowlege.jpg"
              alt="gk_iamge"
            />
            <button
              class="btn selectorBtn fw-bold p-1 section"
              data-section="0"
            >
              GENERAL KNOWLEDGE
            </button>
          </div>
          <div
            class="order-2 d-flex flex-column align-items-center justify-content-center bg-dark border border-dark rounded border-4 gap-2"
          >
            <img
              class="crousel_image border border-dark border-4 rounded"
              src="science.jpg"
              alt="science_image"
            />
            <button
              class="btn selectorBtn fw-bold p-1 section"
              data-section="1"
            >
              SCIENCE
            </button>
          </div>
          <div
            class="order-3 d-flex flex-column align-items-center justify-content-center bg-dark border border-dark rounded border-4 gap-2"
          >
            <img
              class="crousel_image border border-dark border-4 rounded"
              src="maths.jpg"
              alt="maths_image"
            />
            <button
              class="btn selectorBtn fw-bold p-1 section"
              data-section="2"
            >
              MATHEMATICS
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- First Page Layout End -->
    <!-- Second Page Layout Starts -->
    <div id="question-container" class="d-none">
      <div class="d-flex align-items-center justify-content-between">
        <div
          id="logo_section"
          class="ps-5 pt-5 d-flex align-item-center justify-content-left gap-2"
        >
          <div id="logo_image"></div>
          <div id="logo_text" class="fs-1 fw-bold">
            <span class="text-dark">LOGO</span>
          </div>
        </div>
        <p id="score" class="pt-5 me-5 fs-3">
          Score:<span id="scoreValue">0</span>
        </p>
      </div>
      <div
        class="ms-5  me-5 d-flex align-items-center justify-content-center responseArea"
      >
        <div
          class="d-flex align-items-center justify-content-center question_container p-3 w-75 fw-bold fs-3 text-white"
        >
          <p id="questionTag" class="mb-0 text-dark text-center">
            
          </p>
        </div>
      </div>
      <div
        id="options"
        class="ms-5 mt-3 me-5 d-flex align-items-center justify-content-center"
      >
        <div
          class="answerTag d-flex flex-column align-items-center justify-content-center question_container p-3 me-0 w-75 fw-bold fs-4 text-white"
        >
          <div id="optionsTag" class="w-100 text-center"></div>
          <div id="answerResponse" class="w-100 mt-2 fs-5 fw-bold"></div>
          <button id="next-button" class="btn nextBtn mt-2 fw-bold fs-4">
            Next
          </button>
        </div>
      </div>
    </div>
    <!-- Second Page Layout ends -->
    <!-- Third Page Layout Starts -->
    <div id="score-container" class="d-none">
      <div class="d-flex align-items-center justify-content-between">
        <div
          id="logo_section"
          class="ps-5 pt-5 d-flex align-item-center justify-content-left gap-2"
        >
          <div id="logo_image"></div>
          <div id="logo_text" class="fs-1 fw-bold">
            <span class="text-dark">LOGO</span>
          </div>
        </div>
      </div>
      <div>
        <div id="scoreTag" class="d-flex flex-column align-items-center justify-content-center gap-2 text-center">
          <div id="faviconContainer"></div>
          <div>
            <p class="fs-4 fw-bold mb-0 text-white">Quiz Completed</p>
            <p class="fs-4 fw-bold mb-0 text-white">Your Final Score is : <span id="finalScoreTag"></span>/10</p>
            <button class="btn homeBtn fs-3 fw-bold text-white">Go To Home</button>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"
  ></script>
</html>
